<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="SMAPATISPA NEXORA — layanan Bimbingan Konseling & Kesiswaan SMA PGRI 43 Singaparna untuk siswa, orang tua, guru, dan kepala sekolah.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SMAPATISPA NEXORA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Terapkan tema & warna tersimpan sebelum halaman tampil (tanpa kedip) */
    try {
      var t = JSON.parse(localStorage.getItem('nexora:v1:tema') || '"light"');
      document.documentElement.setAttribute('data-theme', t);
      var p = JSON.parse(localStorage.getItem('nexora:v1:pub') || 'null');
      if (p && p.warna_utama) {
        var r = document.documentElement.style;
        r.setProperty('--primary', p.warna_utama); r.setProperty('--accent', p.warna_aksen || '#7C3AED'); r.setProperty('--grad-end', p.warna_akhir || '#3B82F6');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" role="status" aria-label="Memuat aplikasi">
    <div style="text-align:center">
      <div class="logo-tile" style="margin:0 auto">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
      </div>
      <div style="font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:18px;margin-top:14px">SMAPATISPA NEXORA</div>
      <div style="font-size:12px;color:#64748B;margin-top:2px">BK &amp; Kesiswaan</div>
      <div class="spin" style="margin:18px auto 0"></div>
    </div>
  </div>

  <div id="auth" hidden></div>

  <div id="shell" hidden>
    <aside id="sidebar" aria-label="Menu samping"></aside>
    <div id="scrim"></div>
    <div id="main">
      <header id="topbar"></header>
      <main id="view"></main>
    </div>
    <nav id="bottomnav" aria-label="Navigasi bawah"></nav>
  </div>

  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;text-align:center">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript pada peramban Anda.</p></noscript>

  <script defer src="js/config.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/siswa.js"></script>
  <script defer src="js/staf.js"></script>
  <script defer src="js/admin.js"></script>
</body>
</html>
